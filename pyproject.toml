[project]
name = "meeting-analysis"
version = "0.1.0"
description = "A fully local meeting transcription and analysis pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "huggingface-hub==0.36.0",
    "librosa==0.11.0",
    "numpy==2.5.3",
    "protobuf==6.32.1",
    "sentencepiece==0.2.1",
    "sherpa-onnx==1.13.7",
    "soundfile==0.13.1",
    "torch==2.14.0",
    "transformers==4.57.6",
]

[tool.uv]
package = false
